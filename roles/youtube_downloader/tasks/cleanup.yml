- name: stop and remove tubearchivist stack (containers, volumes, network, images)
  community.docker.docker_compose_v2:
    project_src: "{{ directories.services }}/tubearchivist"
    state: absent
    remove_images: all
    remove_volumes: true
  ignore_errors: true

- name: delete tubearchivist directory
  ansible.builtin.file:
    path: "{{ directories.services }}/tubearchivist"
    state: absent
  ignore_errors: true
