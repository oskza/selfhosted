- name: stop and disable cleanup services and timers
  ansible.builtin.systemd:
    name: "{{ name }}"
    state: stopped
    enabled: no
  loop:
    - apt-cleanup.timer
    - docker-cleanup.timer
    - apt-cleanup.service
    - docker-cleanup.service
  loop_control:
    loop_var: name
  ignore_errors: true

- name: remove cleanup files (services, timers, scripts, configs)
  ansible.builtin.file:
    path: "{{ path }}"
    state: absent
  loop:
    - /etc/systemd/system/apt-cleanup.service
    - /etc/systemd/system/apt-cleanup.timer
    - /etc/systemd/system/docker-cleanup.service
    - /etc/systemd/system/docker-cleanup.timer
    - "{{ directories.scripts }}/apt_cleanup.sh"
    - "{{ directories.scripts }}/docker_cleanup.sh"
    - /etc/tmpfiles.d/tmp.conf
    - /etc/apt/apt.conf.d/52unattended-upgrades-local
  loop_control:
    loop_var: path
  notify: reload_systemd

- name: restore journald defaults
  ansible.builtin.replace:
    path: /etc/systemd/journald.conf
    regexp: '^(SystemMaxUse|MaxRetentionSec)=.*'
    replace: '# \g<0>'
  ignore_errors: yes
  notify: restart_journald
