- name: Deploy apt cleanup service
  ansible.builtin.template:
    src: apt-cleanup.service.j2
    dest: /etc/systemd/system/apt-cleanup.service
    owner: root
    group: root
    mode: 0644
  notify: reload_systemd

- name: Deploy apt cleanup timer
  ansible.builtin.template:
    src: apt-cleanup.timer.j2
    dest: /etc/systemd/system/apt-cleanup.timer
    owner: root
    group: root
    mode: 0644
  notify: reload_systemd

- name: Enable and start apt cleanup timer
  ansible.builtin.systemd:
    name: apt-cleanup.timer
    enabled: yes
    state: started

- name: Deploy docker cleanup service
  ansible.builtin.template:
    src: docker-cleanup.service.j2
    dest: /etc/systemd/system/docker-cleanup.service
    owner: root
    group: root
    mode: 0644
  notify: reload_systemd

- name: Deploy docker cleanup timer
  ansible.builtin.template:
    src: docker-cleanup.timer.j2
    dest: /etc/systemd/system/docker-cleanup.timer
    owner: root
    group: root
    mode: 0644
  notify: reload_systemd

- name: Enable and start docker cleanup timer
  ansible.builtin.systemd:
    name: docker-cleanup.timer
    enabled: yes
    state: started

- name: Configure journald limits
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "^#?{{ prop.key }}="
    line: "{{ prop.key }}={{ prop.value }}"
  loop:
    - { key: 'SystemMaxUse', value: '{{ journald_max_use }}' }
    - { key: 'MaxRetentionSec', value: '{{ journald_max_retention }}' }
  loop_control:
    loop_var: prop
    label: "{{ prop.key }}"
  notify: restart_journald

- name: Configure tmpfiles cleanup policy
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/tmp.conf
    content: |
      d /tmp 1777 root root {{ tmp_retention }}
      d /var/tmp 1777 root root {{ var_temp_retention }}
    owner: root
    group: root
    mode: 0644
