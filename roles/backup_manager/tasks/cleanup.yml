- name: stop and disable docker backup timer
  systemd:
    name: docker-backup.timer
    enabled: no
    state: stopped
  ignore_errors: true

- name: stop docker backup service
  systemd:
    name: docker-backup.service
    state: stopped
  ignore_errors: true

- name: remove docker backup files
  ansible.builtin.file:
    path: "{{ path }}"
    state: absent
  loop:
    - /etc/systemd/system/docker-backup.timer
    - /etc/systemd/system/docker-backup.service
    - /etc/docker-backup.conf
    - "{{ directories.scripts }}/docker_volumes_backup.sh"
    - "{{ directories.scripts }}/docker_volumes_restore.sh"
    - "{{ directories.scripts }}/shared/docker_helpers.sh"
  loop_control:
    loop_var: path

- name: reload systemd daemon
  systemd:
    daemon_reload: yes

- name: remove alpine image
  community.docker.docker_image:
    name: alpine
    state: absent
