- name: setup portainer directory
  ansible.builtin.file:
    path: "{{ directories.services }}/portainer"
    state: directory
    owner: "{{ main_user.name }}"
    group: "{{ main_user.name }}"
    mode: 0755

- name: deploy portainer from template file
  ansible.builtin.template:
    src: templates/docker-compose.yml.j2
    dest: "{{ directories.services }}/portainer/docker-compose.yml"
    owner: "{{ main_user.name }}"
    group: "{{ main_user.name }}"
    mode: 0644

- name: run portainer using docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ directories.services }}/portainer"
