open_weather_map:
  latitude: "{{ vault_latitude }}"
  longitude: "{{ vault_longitude }}"
  api_key: "{{ vault_open_weather_map_api_key }}"

glances_port: "{{ vault_glances_port }}"

homepage:
  version: v1.4
  instances:
    - name: admin
      host: "{{ vault_admin_instance_host }}"
      port: "{{ vault_admin_instance_port }}"
  icon_color: d4d4d4
  bookmark_urls:
    github: "{{ vault_github_url }}"
    gdrive: "{{ vault_gdrive_url }}"
    gmail: "{{ vault_gmail_url }}"
    router_ui: "{{ vault_router_ui_url }}"
