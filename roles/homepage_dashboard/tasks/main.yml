- name: setup homepage directories
  ansible.builtin.file:
    path: "{{ directories.services }}/homepage/{{ dir }}"
    state: directory
    owner: "{{ main_user.name }}"
    group: "{{ main_user.name }}"
    mode: 0755
  loop: "{{ homepage.instances | map(attribute='name') | list }}"
  loop_control:
    loop_var: dir

- name: synchronize assets directories
  ansible.posix.synchronize:
    src: "{{ dir }}"
    dest: "{{ directories.services }}/homepage"
  loop:
    - icons
    - images
  loop_control:
    loop_var: dir

- name: deploy homepage from template file
  ansible.builtin.template:
    src: templates/docker-compose.yml.j2
    dest: "{{ directories.services }}/homepage/docker-compose.yml"
    owner: "{{ main_user.name }}"
    group: "{{ main_user.name }}"
    mode: 0644
  
- name: run homepage using docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ directories.services }}/homepage"

- name: generate and deploy homepage config files
  include_tasks: generate_and_deploy_to_container.yml
  loop: "{{ homepage.instances | map(attribute='name') | list }}"
  loop_control:
    loop_var: instance_name




