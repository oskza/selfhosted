- name: install docker
  ansible.builtin.include_tasks: install_docker.yml

- name: create docker external networks
  community.general.docker_network:
    name: "{{ net.name }}"
    driver: "{{ net.driver | default(omit) }}"
    ipam_config: "{{ net.ipam_config | default(omit) }}"
  loop: "{{ docker_external_networks }}"
  loop_control:
    loop_var: net
