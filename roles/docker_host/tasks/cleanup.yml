- name: stop and disable docker services
  ansible.builtin.service:
    name: "{{ service }}"
    state: stopped
    enabled: false
  loop:
    - docker.service
    - containerd.service
  loop_control:
    loop_var: service

- name: delete services directory content
  ansible.builtin.command: rm -rf {{ directories.services }}/*
  ignore_errors: true

- name: get current groups of user
  ansible.builtin.command: id -nG {{ main_user.name }}
  register: user_groups

- name: set user groups excluding docker
  ansible.builtin.user:
    name: "{{ main_user.name }}"
    groups: "{{ user_groups.stdout.split() | difference(['docker']) | join(',') }}"
    append: false

- name: remove docker group
  ansible.builtin.group:
    name: docker
    state: absent

- name: remove docker and related packages
  ansible.builtin.package:
    name: "{{ pkg }}"
    state: absent
  loop:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    - python3-docker
    - python3-jsondiff
  loop_control:
    loop_var: pkg

- name: remove docker apt repository
  ansible.builtin.apt_repository:
    repo: "{{ docker_apt_repository }}"
    state: absent

- name: remove docker GPG apt key
  ansible.builtin.apt_key:
    url: "{{ docker_download_url }}/gpg"
    state: absent
