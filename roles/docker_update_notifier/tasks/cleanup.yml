- name: stop and remove diun container, volume and image
  community.docker.docker_compose_v2:
    project_src: "{{ directories.services }}/diun"
    state: absent
    remove_images: all
    remove_volumes: true
  ignore_errors: true

- name: delete diun directory
  ansible.builtin.file:
    path: "{{ directories.services }}/diun"
    state: absent
  ignore_errors: true
