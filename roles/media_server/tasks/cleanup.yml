- name: stop and remove media server container, volumes and image
  community.docker.docker_compose_v2:
    project_src: "{{ directories.services }}/media-server"
    state: absent
    remove_images: all
    remove_volumes: true
  ignore_errors: true

- name: delete media server directory
  ansible.builtin.file:
    path: "{{ directories.services }}/media-server"
    state: absent
  ignore_errors: true
