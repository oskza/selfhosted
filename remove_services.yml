- hosts: linux_servers
  become: true
  remote_user: "{{ ansible_username }}"
  tasks:
    - name: remove all services
      ansible.builtin.include_role:
        name: "{{ role }}"
        tasks_from: cleanup.yml
      loop:
        - media_server
        - password_manager
        - speedtest_tracker
        - code_server
        - cloudflare_connector
        - system_monitor
        - portainer_manager
        - reverse_proxy
        - local_dns
      loop_control:
        loop_var: role
